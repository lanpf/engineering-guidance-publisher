[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-guidance-publisher"
version = "2.2.0"
description = "Publish and synchronize versioned engineering guidance for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
engineering-guidance = "engineering_guidance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
